name: CI

on:
  pull_request:
    branches:
      - v2
  push:
    branches:
      - v2

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: usuario
          POSTGRES_PASSWORD: clave
          POSTGRES_DB: cuestion_de_datos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usuario -d cuestion_de_datos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://usuario:clave@localhost:5432/cuestion_de_datos
      LLM_PROVIDER: google
      LLM_MODEL: gemini-2.5-flash
      AGENT_MAX_STEPS: "10"
      RUN_MAX_DURATION_S: "600"
      RUN_HEARTBEAT_TIMEOUT_S: "120"
      WORKER_LEASE_TTL_S: "120"
      DELETE_ACTIVE_GRACE_S: "5"
      RETENTION_USER_DAYS: "90"
      RETENTION_EVAL_MONTHS: "24"
      RETENTION_TECH_MONTHS: "12"
      RETENTION_HASH_SALT: ci-placeholder-retention-hash-salt-32-bytes
      CATALOG_STALE_AFTER_DAYS: "8"
      PLACEHOLDER_MIN_RATIO: "0.30"
      MAX_CONCURRENT_RUNS: "3"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      EVAL_MODE: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
        working-directory: .

      - name: Confirm PostgreSQL extensions
        run: |
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          psql "$DATABASE_URL" -c "SELECT extname FROM pg_extension WHERE extname IN ('vector', 'pg_trgm') ORDER BY extname;"

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint backend
        run: ruff check .

      - name: Test backend
        run: pytest -m "not integration"

      - name: Audit backend dependencies
        continue-on-error: true
        run: pip-audit --progress-spinner off

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    env:
      # Valor de pruebas explícito, nunca localhost: la app nunca hace
      # fallback silencioso (lib/config/backendUrl.js) y todos los E2E
      # interceptan `**/v2/agent/*` con `page.route`, así que ningún test
      # depende de que este host resuelva de verdad. `.invalid` es el TLD
      # reservado por RFC 2606 para dominios garantizados como no-reales.
      NEXT_PUBLIC_BACKEND_URL: https://backend.ci.cuestiondedatos.invalid

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Audit client bundle (RNF-011)
        run: npm run audit:bundle

      # Puerta de seguridad BLOQUEANTE (F8-01-R1): cualquier vulnerabilidad
      # `critical` en cualquiera de los dos árboles hace fallar el job — sin
      # `continue-on-error`, sin `|| true`, sin excluir ningún paquete
      # (incluido Vitest) a mano. `npm audit --audit-level=critical` sale
      # con código distinto de cero en cuanto encuentra una crítica; alto y
      # moderado quedan documentados pero no bloquean este incremento.
      - name: Auditoría de seguridad — árbol de producción (bloqueante en crítico)
        run: npm audit --omit=dev --audit-level=critical

      - name: Auditoría de seguridad — árbol completo, incluido tooling (bloqueante en crítico)
        run: npm audit --audit-level=critical

      # channel "chrome" (usado en playwright.config.js/.perf/.prod para
      # Windows local) no aplica en Ubuntu: ahí no existe el fallo de
      # resolución WinSxS que lo motivó, así que en CI ($CI=true) esas
      # configs caen a `channel: undefined` → Chromium embebido normal.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E funcional
        run: npm run test:e2e:functional

      - name: E2E RNF-008 dedicado (1 worker, aislado de la suite paralela)
        run: npm run test:e2e:perf

      - name: E2E verificación de producción
        run: npm run test:e2e:prod

      - name: Subir evidencia de Playwright (solo si falló algo)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
