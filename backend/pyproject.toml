[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuestion-de-datos-backend"
version = "2.0.0"
description = "Backend FastAPI y LangGraph para Cuestion de Datos v2.0"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langchain-anthropic>=0.3,<1",
    "langchain-core>=0.3,<1",
    "langchain-google-genai>=2.1,<3",
    "langgraph>=0.5,<1",
    "langgraph-checkpoint-postgres>=2.0,<3",
    "openpyxl>=3.1,<4",
    "pgvector>=0.4,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6,<7",
    "rfc8785==0.1.4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.9,<3",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.0,<2",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
]
# T-205 (research.md #1, 2026-07-09) decidio el candidato GESTIONADO
# (gemini-embedding-2, 768 dim): no agrega dependencia de runtime nueva,
# langchain-google-genai y httpx ya estan en `dependencies`. Este extra queda
# solo para poder reproducir el benchmark (candidato local, descartado) si
# hace falta reabrir la decision -- version fijas (no rangos), comprobadas
# compatibles con Python 3.12/3.13 en Windows (wheels cp312/cp313 win_amd64
# disponibles en PyPI a 2026-07-09). ipykernel/pandas/psutil son herramental
# del propio notebook (registro de metricas, tabla comparativa, CPU/RAM).
benchmark-embeddings = [
    "sentence-transformers==5.6.0",
    "torch==2.13.0",
    "ipykernel==7.3.0",
    "pandas==3.0.3",
    "psutil==7.2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "eval*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
markers = [
    "integration: pruebas que requieren red, PostgreSQL real o servicios externos",
    "legacy_agent_acceptance: aceptación E2E del runtime legado congelado (app.agent.graph), solo rollback",
    "deterministic_agent_acceptance: aceptación E2E del runtime determinista productivo (execute_deterministic_agent_run_async)",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
