schema_version: golden-v1
suite:
  name: golden-v1
  version: 1.0.0
  status: congelado
  snapshot_at: '2026-07-11'
  description: >-
    Conjunto dorado v1 consolidado de los 10 casos piloto y la extension de
    40 casos: 40 positivos y 10 negativos. Las 40 fuentes positivas fueron
    re-verificadas contra la API real de datos.gov.co el 2026-07-11; sus URLs
    fijan condiciones y, donde aplica, agregaciones que anclan la fila o el
    agregado esperado. Esta bateria organiza los usos descriptivos y de
    capacidad institucional como linea base, y convierte en guardas los
    pedidos de prediccion, causalidad, privacidad, NLP/redes y tiempo real que
    exceden el catalogo estructurado. Esta version queda congelada tras la
    revision sustantiva; cualquier cambio posterior exige golden-v2.
  acceptance_gates:
  - Cada dataset positivo debe existir en el catalogo local real, activo, eligible y con publicador verified (verificado 2026-07-11 para los 40 positivos).
  - Cada hecho positivo debe reproducirse con una consulta deterministica ( y, si aplica, /) contra la API real de datos.gov.co (verificado 2026-07-11 para los 40 positivos).
  - 'Revision sustantiva humana de T-601 completada el 2026-07-11: la bateria distingue diagnostico territorial, capacidad institucional y limites de honestidad; los pedidos de ABM/redes y NLP se evaluan como abstencion fuera del catalogo estructurado.'
  - 'Congelado: cambios posteriores a los casos exigen golden-v2; golden-v1 no se edita (pruebas.md Sec. 4.2).'
  strategic_framework:
    scope: >-
      Esta bateria evalua recuperacion honesta de datos administrativos
      estructurados. Los resultados positivos son una linea base descriptiva
      para diagnostico, focalizacion y rendicion de cuentas; no demuestran
      causalidad, no predicen el futuro ni simulan sistemas complejos.
    typologies:
    - id: diagnostico_territorial_descriptivo
      role: >-
        Linea base con granularidad territorial y sectorial para focalizar
        problemas, alimentar un Territorial Impact Assessment y formular
        preguntas posteriores con evidencia adicional.
      case_ids: [pilot-001-educacion-magdalena, pilot-002-seguridad-homicidios, pilot-003-salud-vigilancia, pilot-007-desercion-antioquia, pilot-008-residuos-villamaria, pilot-014-calidad-agua, pilot-016-codigos-postales, pilot-020-divipola, pilot-021-sensibilizacion-valle, pilot-022-red-vial, pilot-023-eva-agricultura, pilot-024-educacion-etc, pilot-025-educacion-municipal, pilot-026-paridad-genero, pilot-027-paridad-etnica, pilot-036-delitos-sexuales, pilot-037-calidad-aire, pilot-038-precipitacion, pilot-039-temperatura, pilot-040-suspensiones-servicio, pilot-041-eca, pilot-042-disposicion-final]
    - id: capacidad_e_inteligencia_institucional
      role: >-
        Transparencia, ejecucion, control y capacidad estatal. Son insumos
        de rendicion de cuentas, no sustitutos de analisis de discursos,
        PQR, redes sociales u otras fuentes no estructuradas.
      case_ids: [pilot-004-justicia-presupuesto, pilot-005-empleo-publico, pilot-006-planta-entidad, pilot-011-cooperacion-minas, pilot-012-control-fiscal, pilot-013-app-dnp, pilot-015-puestos-electorales, pilot-017-transporte-carretera, pilot-018-transporte-ferreo, pilot-019-trafico-portuario, pilot-028-presupuesto-nacion, pilot-029-gastos-nacion, pilot-030-conciliadores, pilot-031-desmovilizaciones, pilot-032-situacion-penitenciaria, pilot-033-gas-natural-vehicular, pilot-034-fncer, pilot-035-afiliaciones]
    - id: limites_de_honestidad_y_guardas
      role: >-
        Casos de abstencion obligatoria: prediccion determinista,
        causalidad o contrafactuales sin diseno causal, privacidad,
        tiempo real, datos inexistentes y preguntas de redes/NLP fuera del
        catalogo estructurado.
      case_ids: [pilot-009-negativo-proyeccion-futura, pilot-010-negativo-causalidad-barrial, pilot-043-negativo-pronostico-clima, pilot-044-negativo-causalidad-politica, pilot-045-negativo-dato-personal, pilot-046-negativo-tiempo-real, pilot-047-negativo-contrafactual, pilot-048-negativo-ranking-corrupcion, pilot-049-negativo-diagnostico-medico, pilot-050-negativo-dato-inexistente]
