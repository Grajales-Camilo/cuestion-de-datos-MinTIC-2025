- id: pilot-001-educacion-magdalena
  case_type: positive
  question: ¿Qué municipio de Magdalena registró una tasa alta de deserción escolar en 2024 y dónde conviene revisar intervenciones?
  expected_dataset_ids:
  - c4qb-ek68
  expected_facts:
  - description: Zona Bananera registra tasa de deserción 2.44 en 2024.
    source_url: https://www.datos.gov.co/resource/c4qb-ek68.json?%24select=municipios%2Ca_o%2Ctasa_de_deserci_n&%24where=municipios%3D%27Zona%20Bananera%27%20AND%20a_o%3D2024&%24limit=1
    expected_value:
      municipios: Zona Bananera
      a_o: '2024'
      tasa_de_deserci_n: '2.44'
    tolerance: 0.001
  seed: 601001
  notes: Necesidad territorial de educación. Verificar antes de congelar que la Gobernación de Magdalena esté resuelta como publicador oficial y que el dataset siga siendo elegible.
