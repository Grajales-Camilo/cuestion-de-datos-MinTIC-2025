  - c4qb-ek68
  input_constraints:
  - a_o=2024
  - fila = argmax(tasa_de_deserci_n)
  selection_rule: argmax(tasa_de_deserci_n); tie_policy=reject; valor de la fila ganadora del argmax (coordinado
    con el TextualFact)
